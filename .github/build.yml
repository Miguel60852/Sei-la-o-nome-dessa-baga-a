name: Build Sonic Mania Plus (aarch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Compilar em Debian bullseye (glibc 2.31) arm64
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm64 -v "$PWD/out:/out" debian:bullseye bash -c '
          set -e
          apt-get update
          apt-get install -y build-essential cmake git \
            libglew-dev libglfw3-dev libtheora-dev libdrm-dev libgbm-dev
          git clone --recursive https://github.com/RSDKModding/Sonic-Mania-Decompilation
          cd Sonic-Mania-Decompilation
          cmake -B build \
            -DRETRO_REVISION=2 \
            -DRETRO_DISABLE_PLUS=off \
            -DRETRO_SUBSYSTEM=SDL2 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG"
          cmake --build build --config release -j"$(nproc)"
          cp build/libGame.so /out/Game.so
          cp build/dependencies/RSDKv5/RSDKv5 /out/sonicmania
          '
          ls -lh out

      - name: Enviar resultado
        uses: actions/upload-artifact@v4
        with:
          name: mania-plus-aarch64
          path: out/
